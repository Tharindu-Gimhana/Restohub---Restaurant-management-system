name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate backend env file
        run: |
          cat > backend/.env <<EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          PORT=${{ secrets.PORT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          EOF

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Sync to Droplet
        run: |
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "mkdir -p ${{ secrets.DO_APP_DIR }}"

          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "/.env" \
            ./ ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:${{ secrets.DO_APP_DIR }}

      - name: Install, build, restart
        run: |
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DO_APP_DIR }}

            if [ ! -f backend/.env ]; then
              echo "ERROR: backend/.env is missing after sync." >&2
              exit 1
            fi

            cd backend
            npm ci --omit=dev
            cd ..

            cd Frontend
            npm ci
            npm run build
            cd ..

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save

            ok=0
            for i in $(seq 1 12); do
              code=$(curl --max-time 10 -sS -o /dev/null -w "%{http_code}" \
                -X POST "http://127.0.0.1:5000/api/auth/login" \
                -H "Content-Type: application/json" \
                -d '{"username":"healthcheck","password":"healthcheck"}' || true)

              if [ "$code" = "200" ] || [ "$code" = "401" ]; then
                ok=1
                break
              fi

              sleep 2
            done

            if [ "$ok" -ne 1 ]; then
              echo "ERROR: Backend health check failed after restart" >&2
              pm2 logs restohub-backend --lines 80 --nostream || true
              exit 1
            fi
          EOF
